name: "Вопрос по проекту или цифровому кодексу"
description: "Задайте вопрос, уточнение или комментарий по текущему репозиторию или положениям цифрового кодекса."
title: "[question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что хотите задать вопрос!
        Пожалуйста, заполните форму ниже, чтобы нам было проще ответить.

  - type: input
    id: topic
    attributes:
      label: "Тема вопроса"
      description: "Коротко опишите, к чему относится ваш вопрос (например: «Глава 3», «Лицензирование», «Термины», «Техническая часть репозитория»)."
      placeholder: "Например: Статья 1. Отношения, регулируемые настоящим Кодексом"
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: "Ваш вопрос"
      description: "Опишите ваш вопрос как можно подробнее. Если вы ссылаетесь на конкретную статью или пункт, укажите её."
      placeholder: "Опишите, что именно вызывает вопрос или требует уточнения..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Контекст / дополнительные сведения (опционально)"
      description: "Если вопрос возник из конкретной ситуации, опыта или документа — добавьте сюда краткий контекст."
      placeholder: "Например: при чтении раздела 9.1 возникло сомнение по определению 'цифровое правительство'."

  - type: checkboxes
    id: langs
    attributes:
      label: "Языки, к которым относится вопрос"
      description: "Отметьте языковые версии, если вопрос связан с конкретной локализацией цифрового кодекса."
      options:
        - label: "Русский (RU)"
        - label: "Английский (EN)"
        - label: "Казахский (KZ)"

  - type: dropdown
    id: urgency
    attributes:
      label: "Приоритет / срочность вопроса"
      description: "Помогает команде CODEOWNERS понимать, насколько быстро требуется ответ."
      options:
        - "Низкий (может подождать)"
        - "Средний (желательно в течение недели)"
        - "Высокий (нужно оперативное уточнение)"
      default: 1

  - type: markdown
    attributes:
      value: |
        ---
        *Ваш вопрос будет рассмотрен одним из участников проекта.
        Если он касается конкретной главы, пожалуйста, упомяните её в описании.*
